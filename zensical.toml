[project]
site_name = "ZX909 Tracker Research"
site_description = "Hardware, firmware, LTE, and MQTT research notes for the ZX909 tracker family."
site_url = "https://frozengalaxy.github.io/zx909-tracker-docs/"
repo_url = "https://github.com/FrozenGalaxy/zx909-tracker-docs"
repo_name = "FrozenGalaxy/zx909-tracker-docs"
nav = [
  { "Overview" = "index.md" },
  { "Hardware and USB" = "hardware-usb.md" },
  { "AT commands" = "at-commands.md" },
  { "Firmware backup and restore" = "firmware-restore.md" },
  { "LTE findings" = "lte.md" },
  { "MQTT path" = "mqtt.md" },
  { "Sources and tools" = "sources-tools.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
